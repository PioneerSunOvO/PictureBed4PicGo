<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PictureBed4PicGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elev: rgba(18, 24, 33, 0.82);
      --bg-card: #121820;
      --line: rgba(148, 163, 184, 0.14);
      --text: #e8eef7;
      --muted: #8b9bb0;
      --accent: #2dd4bf;
      --accent-dim: rgba(45, 212, 191, 0.14);
      --warn: #f59e0b;
      --warn-dim: rgba(245, 158, 11, 0.16);
      --danger: #f43f5e;
      --danger-dim: rgba(244, 63, 94, 0.14);
      --glow: 0 0 0 1px var(--line), 0 18px 50px rgba(0, 0, 0, 0.45);
      --radius: 16px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(45, 212, 191, 0.12), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(56, 189, 248, 0.08), transparent 50%),
        var(--bg);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      opacity: 0.55;
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 28px 20px 64px; }

    .hero {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
      justify-content: space-between; margin-bottom: 22px;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #f8fafc 20%, #2dd4bf 70%, #38bdf8);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 46ch; line-height: 1.5; }
    .hero a { color: var(--accent); text-decoration: none; }
    .hero a:hover { text-decoration: underline; }

    .glass {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      box-shadow: var(--glow);
    }
    .panel { padding: 16px; margin-bottom: 14px; }
    .panel-title {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 12px; font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .panel-title .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 10px var(--accent);
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row + .row { margin-top: 10px; }

    input, select, button, .chip {
      font-family: var(--sans);
      font-size: 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      border-color: rgba(45, 212, 191, 0.55);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    input[type=password], input[type=search] { min-width: 220px; flex: 1; }
    input[type=password] { font-family: var(--mono); font-size: 0.8rem; }
    select { cursor: pointer; }
    button { cursor: pointer; white-space: nowrap; }
    button:hover { background: rgba(255,255,255,0.07); border-color: rgba(148,163,184,0.3); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    button.primary {
      background: linear-gradient(135deg, #14b8a6, #0ea5e9);
      border: none; color: #041018; font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, #14b8a6, #0ea5e9); }
    button.danger {
      background: var(--danger-dim); border-color: rgba(244,63,94,0.35); color: #fda4af;
    }
    button.danger:hover { background: rgba(244,63,94,0.28); }
    button.ghost { background: transparent; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; cursor: pointer; user-select: none;
    }
    .chip input { margin: 0; accent-color: var(--accent); }
    .chip.on {
      background: var(--warn-dim); border-color: rgba(245,158,11,0.4); color: #fcd34d;
    }
    .chip .count {
      font-family: var(--mono); font-size: 0.75rem;
      padding: 1px 6px; border-radius: 999px;
      background: rgba(0,0,0,0.25);
    }

    .stats-bar {
      display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
      margin: 4px 0 14px; color: var(--muted); font-size: 0.88rem;
    }
    .stats-bar strong { color: var(--text); font-weight: 600; }
    .status { min-height: 1.2em; font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .status.err { color: #fda4af; }
    .status.ok { color: #5eead4; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .2s ease, border-color .2s, box-shadow .2s;
      animation: rise .35s ease both;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(45, 212, 191, 0.35);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(45,212,191,0.12);
    }
    .card.selected {
      border-color: rgba(45, 212, 191, 0.65);
      box-shadow: 0 0 0 1px rgba(45,212,191,0.35), 0 12px 32px rgba(0,0,0,0.35);
    }
    .card.dup { border-color: rgba(245, 158, 11, 0.35); }
    .card.dup::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--warn), transparent);
      z-index: 3;
    }
    .card-check {
      position: absolute; top: 12px; left: 12px; z-index: 4;
      width: 18px; height: 18px; accent-color: var(--accent);
    }
    .badge {
      position: absolute; top: 12px; right: 12px; z-index: 4;
      font-family: var(--mono); font-size: 0.68rem; font-weight: 500;
      padding: 4px 8px; border-radius: 999px;
      background: rgba(15, 17, 21, 0.82);
      border: 1px solid rgba(245,158,11,0.45);
      color: #fcd34d;
      backdrop-filter: blur(8px);
      letter-spacing: 0.02em;
    }
    .thumb-wrap {
      aspect-ratio: 1;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.03), transparent),
        #0a0e13;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: zoom-in;
    }
    .thumb-wrap img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      transition: transform .35s ease;
    }
    .card:hover .thumb-wrap img { transform: scale(1.04); }
    .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .name {
      font-family: var(--mono); font-size: 0.72rem; line-height: 1.45;
      word-break: break-all; color: #dbe7f5; min-height: 2.9em;
    }
    .old {
      font-size: 0.7rem; color: var(--muted); word-break: break-all;
      line-height: 1.35; opacity: 0.85;
    }
    .hash-tag {
      font-family: var(--mono); font-size: 0.65rem; color: #64748b;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .actions button, .actions a {
      font-size: 0.72rem; padding: 6px 9px; border-radius: 8px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.03);
      color: var(--text); text-decoration: none; cursor: pointer;
    }
    .actions button:hover, .actions a:hover { background: rgba(255,255,255,0.08); }
    .actions .del {
      background: var(--danger-dim); border-color: rgba(244,63,94,0.35); color: #fda4af;
    }
    .actions .del:hover { background: rgba(244,63,94,0.28); }
    .actions .del:disabled { opacity: 0.35; cursor: not-allowed; }

    .empty {
      grid-column: 1 / -1; text-align: center; padding: 72px 20px;
      color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius);
    }

    .modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(3, 6, 10, 0.88); backdrop-filter: blur(10px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal.open { display: flex; animation: fade .2s ease; }
    .modal img {
      max-width: min(96vw, 1200px); max-height: 88vh; object-fit: contain;
      border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .modal .close {
      position: fixed; top: 18px; right: 22px; font-size: 1.8rem;
      color: #fff; cursor: pointer; line-height: 1; opacity: 0.8;
    }
    .modal .close:hover { opacity: 1; }

    #replaceInput { display: none; }
    .hidden { display: none !important; }
    #patStatus { font-size: 0.8rem; color: var(--muted); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .wrap { padding: 18px 14px 48px; }
      input[type=password], input[type=search] { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <h1>PictureBed4PicGo</h1>
        <p>打开自动同步 GitHub · 重复按文件名 hash 标记 · 管理需 PAT（仅存本页 session）· <a href="https://pioneersunovo.github.io/PictureBed4PicGo/gallery.html" target="_blank" rel="noopener">Pages</a></p>
      </div>
    </header>

    <section class="glass panel" id="authPanel">
      <div class="panel-title"><span class="dot"></span> GitHub 管理</div>
      <div class="row">
        <input type="password" id="pat" placeholder="GitHub PAT（repo 权限）" autocomplete="off">
        <button type="button" id="savePat" class="primary">保存 Token</button>
        <button type="button" id="clearPat" class="ghost">清除</button>
        <button type="button" id="refreshList">手动同步</button>
        <span id="patStatus"></span>
      </div>
      <div class="row hidden" id="manageBar">
        <label class="chip"><input type="checkbox" id="selectAll"> 全选当前</label>
        <span id="selCount" style="color:var(--muted);font-size:0.85rem">已选 0</span>
        <button type="button" id="batchDelete" class="danger" disabled>批量删除</button>
        <button type="button" id="batchRename" disabled>重命名选中</button>
        <button type="button" id="batchReplace" disabled>替换选中</button>
      </div>
      <input type="file" id="replaceInput" accept="image/*">
    </section>

    <div class="stats-bar" id="stats"></div>
    <div class="status" id="status"></div>

    <section class="glass panel">
      <div class="row">
        <input type="search" id="q" placeholder="搜索文件名 / 旧路径 / hash…">
        <select id="source">
          <option value="cdn">jsDelivr CDN</option>
          <option value="raw">GitHub Raw</option>
          <option value="local">本地 images/</option>
        </select>
        <label class="chip" id="dupFilterChip"><input type="checkbox" id="dupOnly"> 只看重复 <span class="count" id="dupCount">0</span></label>
        <button type="button" id="copyName" class="ghost">复制选中名</button>
      </div>
    </section>

    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal"><span class="close" id="closeModal">&times;</span><img id="modalImg" alt=""></div>

  <script>
    const REPO = { owner: 'PioneerSunOvO', repo: 'PictureBed4PicGo', branch: 'master' };
  </script>
  <script src="gallery-app.js"></script>
  <script>
    GalleryApp.init({ items: [], oldMap: {} });
  </script>
</body>
</html>
