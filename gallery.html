<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PictureBed4PicGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2e261c;
      --bg-elev: #3a3128;
      --bg-card: #42382f;
      --bg-thumb: #ebe4d6;
      --line: rgba(255, 236, 210, 0.1);
      --text: #ede6dc;
      --muted: #a89f92;
      --accent: #c9a96e;
      --accent-dim: rgba(201, 169, 110, 0.14);
      --warn: #d4a853;
      --warn-dim: rgba(212, 168, 83, 0.14);
      --danger: #d48a7a;
      --danger-dim: rgba(212, 138, 122, 0.14);
      --shadow: 0 8px 32px rgba(30, 20, 10, 0.28);
      --radius: 14px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(100% 80% at 50% -20%, rgba(201, 169, 110, 0.1), transparent 50%),
        var(--bg);
      background-attachment: fixed;
    }
    .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 28px 20px 64px; }

    .hero {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
      justify-content: space-between; margin-bottom: 22px;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(1.5rem, 3vw, 1.95rem);
      letter-spacing: -0.02em;
      font-weight: 600;
      color: #f5f0e8;
    }
    .hero p { margin: 0; color: var(--muted); font-size: 0.92rem; max-width: 46ch; line-height: 1.55; }
    .hero a { color: var(--accent); text-decoration: none; }
    .hero a:hover { color: #dcc9a8; }

    .glass {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel { padding: 16px; margin-bottom: 14px; }
    .panel-title {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 12px; font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .panel-title .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: 0.85;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row + .row { margin-top: 10px; }

    input, select, button, .chip {
      font-family: var(--sans);
      font-size: 0.88rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 236, 210, 0.05);
      color: var(--text);
      padding: 8px 12px;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: rgba(201, 169, 110, 0.4);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    input[type=password], input[type=search] { min-width: 220px; flex: 1; }
    input[type=password] { font-family: var(--mono); font-size: 0.8rem; }
    select { cursor: pointer; }
    button { cursor: pointer; white-space: nowrap; }
    button:hover { background: rgba(255, 236, 210, 0.08); border-color: rgba(255, 236, 210, 0.14); }
    button:active { opacity: 0.9; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.primary {
      background: rgba(201, 169, 110, 0.28);
      border-color: rgba(201, 169, 110, 0.38);
      color: #f5ead8; font-weight: 500;
    }
    button.primary:hover {
      background: rgba(201, 169, 110, 0.36);
      border-color: rgba(201, 169, 110, 0.48);
    }
    button.danger {
      background: var(--danger-dim); border-color: rgba(212, 138, 122, 0.28); color: #e8c4b8;
    }
    button.danger:hover { background: rgba(212, 138, 122, 0.22); }
    button.ghost { background: transparent; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; cursor: pointer; user-select: none;
    }
    .chip input { margin: 0; accent-color: var(--accent); }
    .chip.on {
      background: var(--warn-dim); border-color: rgba(212, 168, 83, 0.32); color: #e8d4a0;
    }
    .chip .count {
      font-family: var(--mono); font-size: 0.75rem;
      padding: 1px 6px; border-radius: 999px;
      background: rgba(30, 22, 14, 0.3);
    }

    .stats-bar {
      display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
      margin: 4px 0 14px; color: var(--muted); font-size: 0.88rem;
    }
    .stats-bar strong { color: var(--text); font-weight: 600; }
    .status { min-height: 1.2em; font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .status.err { color: #e8c4b8; }
    .status.ok { color: #dcc9a8; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color .25s ease, box-shadow .25s ease;
      animation: rise .35s ease both;
    }
    .card:hover {
      border-color: rgba(255, 236, 210, 0.14);
      box-shadow: 0 10px 28px rgba(30, 20, 10, 0.22);
    }
    .card.selected {
      border-color: rgba(201, 169, 110, 0.45);
      box-shadow: 0 0 0 1px rgba(201, 169, 110, 0.18);
    }
    .card.dup { border-color: rgba(212, 168, 83, 0.28); }
    .card.dup::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
      background: rgba(212, 168, 83, 0.6);
      z-index: 3;
    }
    .card-check {
      position: absolute; top: 12px; left: 12px; z-index: 4;
      width: 18px; height: 18px; accent-color: var(--accent);
    }
    .badge {
      position: absolute; top: 10px; right: 10px; z-index: 4;
      font-family: var(--mono); font-size: 0.65rem; font-weight: 500;
      padding: 3px 8px; border-radius: 6px;
      background: rgba(50, 42, 34, 0.92);
      border: 1px solid rgba(212, 168, 83, 0.32);
      color: #e8d4a0;
      letter-spacing: 0.02em;
    }
    .thumb-wrap {
      aspect-ratio: 1;
      background: var(--bg-thumb);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: zoom-in;
      padding: 10px;
    }
    .thumb-wrap img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(60, 45, 30, 0.12);
      transition: opacity .25s ease;
    }
    .card:hover .thumb-wrap img { opacity: 0.95; }
    .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .name {
      font-family: var(--mono); font-size: 0.71rem; line-height: 1.45;
      word-break: break-all; color: #ddd4c8; min-height: 2.9em;
    }
    .old {
      font-size: 0.7rem; color: var(--muted); word-break: break-all;
      line-height: 1.35; opacity: 0.85;
    }
    .hash-tag {
      font-family: var(--mono); font-size: 0.65rem; color: #8a7f72;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .actions button, .actions a {
      font-size: 0.72rem; padding: 6px 9px; border-radius: 8px;
      border: 1px solid var(--line); background: rgba(255, 236, 210, 0.04);
      color: var(--text); text-decoration: none; cursor: pointer;
    }
    .actions button:hover, .actions a:hover { background: rgba(255, 236, 210, 0.1); }
    .actions .del {
      background: var(--danger-dim); border-color: rgba(212, 138, 122, 0.28); color: #e8c4b8;
    }
    .actions .del:hover { background: rgba(212, 138, 122, 0.22); }
    .actions .del:disabled { opacity: 0.35; cursor: not-allowed; }

    .empty {
      grid-column: 1 / -1; text-align: center; padding: 72px 20px;
      color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius);
    }

    .modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(46, 38, 28, 0.9); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal.open { display: flex; animation: fade .2s ease; }
    .modal img {
      max-width: min(96vw, 1200px); max-height: 88vh; object-fit: contain;
      border-radius: 12px; box-shadow: 0 30px 80px rgba(30, 20, 10, 0.45);
    }
    .modal .close {
      position: fixed; top: 18px; right: 22px; font-size: 1.8rem;
      color: var(--text); cursor: pointer; line-height: 1; opacity: 0.75;
    }
    .modal .close:hover { opacity: 1; color: #f5f0e8; }

    #replaceInput { display: none; }
    .hidden { display: none !important; }
    #patStatus { font-size: 0.8rem; color: var(--muted); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .wrap { padding: 18px 14px 48px; }
      input[type=password], input[type=search] { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <h1>PictureBed4PicGo</h1>
        <p>打开自动同步 GitHub · 重复按文件名 hash 标记 · 管理需 PAT（仅存本页 session）· <a href="https://pioneersunovo.github.io/PictureBed4PicGo/gallery.html" target="_blank" rel="noopener">Pages</a></p>
      </div>
    </header>

    <section class="glass panel" id="authPanel">
      <div class="panel-title"><span class="dot"></span> GitHub 管理</div>
      <div class="row">
        <input type="password" id="pat" placeholder="GitHub PAT（repo 权限）" autocomplete="off">
        <button type="button" id="savePat" class="primary">保存 Token</button>
        <button type="button" id="clearPat" class="ghost">清除</button>
        <button type="button" id="refreshList">手动同步</button>
        <span id="patStatus"></span>
      </div>
      <div class="row hidden" id="manageBar">
        <label class="chip"><input type="checkbox" id="selectAll"> 全选当前</label>
        <span id="selCount" style="color:var(--muted);font-size:0.85rem">已选 0</span>
        <button type="button" id="batchDelete" class="danger" disabled>批量删除</button>
        <button type="button" id="batchRename" disabled>重命名选中</button>
        <button type="button" id="batchReplace" disabled>替换选中</button>
      </div>
      <input type="file" id="replaceInput" accept="image/*">
    </section>

    <div class="stats-bar" id="stats"></div>
    <div class="status" id="status"></div>

    <section class="glass panel">
      <div class="row">
        <input type="search" id="q" placeholder="搜索文件名 / 旧路径 / hash…">
        <select id="source">
          <option value="cdn">jsDelivr CDN</option>
          <option value="raw">GitHub Raw</option>
          <option value="local">本地 images/</option>
        </select>
        <label class="chip" id="dupFilterChip"><input type="checkbox" id="dupOnly"> 只看重复 <span class="count" id="dupCount">0</span></label>
        <button type="button" id="copyName" class="ghost">复制选中名</button>
      </div>
    </section>

    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal"><span class="close" id="closeModal">&times;</span><img id="modalImg" alt=""></div>

  <script>
    const REPO = { owner: 'PioneerSunOvO', repo: 'PictureBed4PicGo', branch: 'master' };
  </script>
  <script src="gallery-app.js"></script>
  <script>
    GalleryApp.init({ items: [], oldMap: {} });
  </script>
</body>
</html>
