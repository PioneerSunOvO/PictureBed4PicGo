    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const source = document.getElementById('source');
    const stats = document.getElementById('stats');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    let selected = null;

    if (location.protocol !== 'file:') {
      const localOpt = source.querySelector('option[value="local"]');
      if (localOpt) localOpt.remove();
    }

    function srcOf(item) {
      if (source.value === 'raw') return item.raw;
      if (source.value === 'local') return 'images/' + item.name;
      return item.cdn;
    }

    function render(list) {
      grid.innerHTML = '';
      stats.textContent = '显示 ' + list.length + ' / ' + ITEMS.length + ' 张';
      if (!list.length) {
        grid.innerHTML = '<div class="empty">没有匹配结果</div>';
        return;
      }
      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        const url = srcOf(item);
        card.innerHTML = `
          <div class="thumb-wrap"><img loading="lazy" alt="" src="${url}"></div>
          <div class="meta">
            <div class="name">${item.name}</div>
            ${item.oldRel ? '<div class="old">旧: ' + item.oldRel + '</div>' : ''}
            <div class="actions">
              <button type="button" data-copy="${item.name}">复制文件名</button>
              <button type="button" data-copy="${url}">复制链接</button>
              <a href="${url}" target="_blank" rel="noopener">打开</a>
            </div>
          </div>`;
        card.querySelector('.thumb-wrap').onclick = () => {
          modalImg.src = url;
          modal.classList.add('open');
        };
        card.onclick = (e) => {
          if (e.target.closest('button, a')) return;
          selected = item.name;
          document.querySelectorAll('.card').forEach(c => c.style.outline = '');
          card.style.outline = '2px solid #4a90e2';
        };
        grid.appendChild(card);
      });
    }

    function filter() {
      const kw = q.value.trim().toLowerCase();
      const list = !kw ? ITEMS : ITEMS.filter(i =>
        i.name.toLowerCase().includes(kw) ||
        (i.oldRel && i.oldRel.toLowerCase().includes(kw))
      );
      render(list);
    }

    grid.addEventListener('click', e => {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      navigator.clipboard.writeText(btn.dataset.copy);
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = old; }, 1200);
    });

    document.getElementById('copyName').onclick = () => {
      if (!selected) return alert('先点一张图选中');
      navigator.clipboard.writeText(selected);
    };

    q.oninput = filter;
    source.onchange = filter;
    document.getElementById('closeModal').onclick = () => modal.classList.remove('open');
    modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };
    filter();
  </script>
</body>
</html>
