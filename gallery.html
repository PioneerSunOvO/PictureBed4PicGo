<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PictureBed4PicGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7f9;
      --bg-panel: #ffffff;
      --bg-sidebar: #f0f2f5;
      --bg-hover: #eef1f5;
      --bg-active: #e8edf5;
      --bg-thumb: #eceff3;
      --line: #e2e6ec;
      --line-strong: #d0d6df;
      --text: #111827;
      --muted: #6b7280;
      --accent: #4f6ef7;
      --accent-hover: #3d5ce6;
      --accent-dim: rgba(79, 110, 247, 0.12);
      --warn: #d97706;
      --warn-dim: rgba(217, 119, 6, 0.1);
      --danger: #dc2626;
      --danger-dim: rgba(220, 38, 38, 0.08);
      --success: #059669;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow: 0 4px 16px rgba(16, 24, 40, 0.08);
      --shadow-lg: 0 16px 48px rgba(16, 24, 40, 0.12);
      --radius: 10px;
      --radius-lg: 14px;
      --sidebar-w: 220px;
      --detail-w: 320px;
      --toolbar-h: 56px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: 1fr;
      height: 100vh;
    }
    .app.detail-open { grid-template-columns: var(--sidebar-w) 1fr var(--detail-w); }

    /* Sidebar — Immich-style nav */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .brand {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--line);
    }
    .brand h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 4px 0 0;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .nav {
      flex: 1;
      padding: 10px 8px;
      overflow-y: auto;
    }
    .nav-section {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 10px 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background .15s;
    }
    .nav-item:hover { background: var(--bg-hover); }
    .nav-item.active {
      background: var(--bg-active);
      color: var(--accent);
    }
    .nav-item .icon {
      width: 18px;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
    }
    .nav-item .count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      background: rgba(0,0,0,.04);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .nav-item.active .count { color: var(--accent); background: var(--accent-dim); }
    .sidebar-foot {
      padding: 12px;
      border-top: 1px solid var(--line);
    }
    .auth-block { display: flex; flex-direction: column; gap: 6px; }
    .auth-user {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 8px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    /* Main */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .toolbar {
      height: var(--toolbar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
    }
    .toolbar .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .toolbar .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .toolbar input[type=search] {
      width: 100%;
      padding: 8px 12px 8px 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      font-size: 0.86rem;
      outline: none;
    }
    .toolbar input[type=search]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .toolbar select, .toolbar button {
      font-family: var(--sans);
      font-size: 0.82rem;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar button:hover, .toolbar select:hover { background: var(--bg-hover); }
    .toolbar button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    .toolbar button.primary:hover { background: var(--accent-hover); }
    .toolbar button.danger {
      color: var(--danger);
      border-color: rgba(220,38,38,.25);
      background: var(--danger-dim);
    }
    .toolbar button:disabled { opacity: .4; cursor: not-allowed; }
    .view-toggle {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .view-toggle button {
      border: none;
      border-radius: 0;
      padding: 7px 10px;
      background: var(--bg-panel);
    }
    .view-toggle button + button { border-left: 1px solid var(--line); }
    .view-toggle button.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .status-bar strong { color: var(--text); }
    .status { min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--success); }

    /* Date groups — Immich timeline */
    .date-group { margin-bottom: 20px; }
    .date-group-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 10px 2px;
      letter-spacing: 0.02em;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      animation: rise .3s ease both;
    }
    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    .card.dup { border-color: rgba(217,119,6,.35); }
    .card-check {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      opacity: 0;
      transition: opacity .15s;
    }
    .card:hover .card-check, .card.selected .card-check { opacity: 1; }
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(217,119,6,.3);
      color: var(--warn);
    }
    .type-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 4;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(17,24,39,.65);
      color: #fff;
      letter-spacing: 0.04em;
    }
    .thumb-wrap {
      aspect-ratio: 1;
      background: var(--bg-thumb);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .thumb-wrap img, .thumb-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-icon {
      font-size: 2.2rem;
      opacity: 0.45;
      user-select: none;
    }
    .thumb-ext {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
    .card-hover {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(17,24,39,.55));
      opacity: 0;
      transition: opacity .2s;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      gap: 4px;
      z-index: 3;
    }
    .card:hover .card-hover { opacity: 1; }
    .card-hover button {
      font-size: 0.68rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,.92);
      color: var(--text);
      cursor: pointer;
    }
    .card-hover button:hover { background: #fff; }
    .card-hover button.del { color: var(--danger); }
    .card-meta {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--line);
    }
    .card-name {
      font-family: var(--mono);
      font-size: 0.68rem;
      line-height: 1.4;
      word-break: break-all;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-date {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* List view */
    .list { display: flex; flex-direction: column; gap: 4px; }
    .list-row {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .list-row:hover { background: var(--bg-hover); }
    .list-row.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .list-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: var(--bg-thumb);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .list-info .name {
      font-family: var(--mono);
      font-size: 0.78rem;
      word-break: break-all;
    }
    .list-info .sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .list-actions { display: flex; gap: 4px; }
    .list-actions button {
      font-size: 0.72rem;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-panel);
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
      background: var(--bg-panel);
    }

    /* Duplicate / similar groups */
    .dup-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 14px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .dup-toolbar .hint {
      flex: 1;
      min-width: 200px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .dup-toolbar button {
      font-size: 0.82rem;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      cursor: pointer;
    }
    .dup-toolbar button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .dup-toolbar label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dup-toolbar input[type=range] { width: 100px; accent-color: var(--accent); }

    .dup-group {
      margin-bottom: 22px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .dup-group-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--line);
    }
    .dup-group-title {
      font-size: 0.86rem;
      font-weight: 600;
      flex: 1;
      min-width: 160px;
    }
    .dup-group-title .sub {
      font-weight: 400;
      color: var(--muted);
      font-size: 0.78rem;
      margin-left: 6px;
    }
    .dup-group-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .dup-group-actions button {
      font-size: 0.75rem;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg-panel);
      cursor: pointer;
    }
    .dup-group-actions button:hover { background: var(--bg-active); }
    .dup-group-grid {
      padding: 14px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .card.keep { border-color: rgba(5, 150, 105, 0.45); }
    .keep-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 5;
      font-size: 0.62rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(5, 150, 105, 0.92);
      color: #fff;
      letter-spacing: 0.03em;
    }
    .card.selected:not(.keep) { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-dim); }
    .scan-progress {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .scan-progress .bar {
      height: 6px;
      background: var(--line);
      border-radius: 999px;
      margin: 16px auto;
      max-width: 320px;
      overflow: hidden;
    }
    .scan-progress .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width .2s;
    }

    /* Detail panel — ImageKit DAM metadata */
    .detail-panel {
      display: none;
      flex-direction: column;
      background: var(--bg-panel);
      border-left: 1px solid var(--line);
      overflow: hidden;
    }
    .app.detail-open .detail-panel { display: flex; }
    .detail-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-head h2 {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .detail-close {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .detail-close:hover { background: var(--bg-hover); color: var(--text); }
    .detail-preview {
      aspect-ratio: 1;
      background: var(--bg-thumb);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }
    .detail-preview img, .detail-preview video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }
    .detail-section {
      margin-bottom: 16px;
    }
    .detail-section h3 {
      margin: 0 0 8px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 10px;
    }
    .meta-label { font-size: 0.72rem; color: var(--muted); }
    .meta-value {
      font-family: var(--mono);
      font-size: 0.72rem;
      word-break: break-all;
      line-height: 1.45;
    }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .detail-actions button, .detail-actions a {
      font-size: 0.78rem;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .detail-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .detail-actions button.danger {
      color: var(--danger);
      border-color: rgba(220,38,38,.25);
      background: var(--danger-dim);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(17,24,39,.88);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 96vw;
      max-height: 96vh;
      min-width: 0;
    }
    .lightbox-media {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      max-height: calc(96vh - 44px);
      width: 100%;
    }
    .lightbox-media img,
    .lightbox-media video {
      display: block;
      max-width: 96vw;
      max-height: calc(96vh - 44px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }
    .lightbox-media audio {
      width: min(92vw, 480px);
    }
    .lightbox-media iframe {
      width: min(92vw, 900px);
      height: min(75vh, calc(96vh - 44px));
      border: none;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
    }
    .lightbox-text {
      width: min(92vw, 800px);
      max-height: calc(96vh - 44px);
      overflow: auto;
      background: #1e293b;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,.22); }
    .lightbox-nav.prev { left: 20px; }
    .lightbox-nav.next { right: 20px; }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 20px;
      border: none;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 1.6rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
    }
    .lightbox-close:hover { background: rgba(255,255,255,.22); }
    .lightbox-caption {
      flex-shrink: 0;
      margin-top: 10px;
      padding: 0 8px;
      color: rgba(255,255,255,.8);
      font-size: 0.82rem;
      font-family: var(--mono);
      text-align: center;
      max-width: 96vw;
      word-break: break-all;
      line-height: 1.4;
    }

    .hidden { display: none !important; }
    #replaceInput { display: none; }
    #patRow { padding: 0 12px 8px; }
    #patRow input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .pat-toggle {
      font-size: 0.75rem;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 6px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .pat-toggle:hover { color: var(--text); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 900px) {
      .app, .app.detail-open { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .detail-panel { display: none !important; }
    }
    @media (max-width: 640px) {
      .toolbar { flex-wrap: wrap; height: auto; padding: 10px; }
      .toolbar .search-wrap { max-width: 100%; flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="app" id="appShell">
    <aside class="sidebar">
      <div class="brand">
        <h1>PictureBed</h1>
        <p>GitHub 图床 · 自动同步</p>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-section">媒体库</div>
        <button type="button" class="nav-item active" data-cat="all"><span class="icon">▦</span>全部 <span class="count" id="cntAll">0</span></button>
        <button type="button" class="nav-item" data-cat="image"><span class="icon">🖼</span>图片 <span class="count" id="cntImage">0</span></button>
        <button type="button" class="nav-item" data-cat="video"><span class="icon">▶</span>视频 <span class="count" id="cntVideo">0</span></button>
        <button type="button" class="nav-item" data-cat="audio"><span class="icon">♫</span>音频 <span class="count" id="cntAudio">0</span></button>
        <button type="button" class="nav-item" data-cat="document"><span class="icon">📄</span>文档 <span class="count" id="cntDocument">0</span></button>
        <button type="button" class="nav-item" data-cat="text"><span class="icon">⌨</span>文本 <span class="count" id="cntText">0</span></button>
        <button type="button" class="nav-item" data-cat="other"><span class="icon">📦</span>其他 <span class="count" id="cntOther">0</span></button>
        <div class="nav-section">工具</div>
        <button type="button" class="nav-item" data-cat="dup"><span class="icon">⚠</span>重复 <span class="count" id="dupCount">0</span></button>
        <button type="button" class="nav-item" data-cat="similar"><span class="icon">◎</span>相似 <span class="count" id="similarCount">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="auth-block" id="authPanel">
          <div id="loginRow">
            <button type="button" id="githubLogin" class="nav-item primary" style="justify-content:center;background:var(--accent);color:#fff;border:none;">GitHub 登录</button>
            <button type="button" id="refreshList" class="nav-item" style="justify-content:center;">同步</button>
            <span id="patStatus" style="font-size:.72rem;color:var(--muted);padding:0 4px;"></span>
            <button type="button" id="patToggle" class="pat-toggle">手动 PAT ▾</button>
          </div>
          <div class="hidden" id="loggedRow">
            <span class="auth-user" id="authUser"></span>
            <button type="button" id="refreshListLogged" class="nav-item" style="justify-content:center;">同步</button>
            <button type="button" id="githubLogout" class="nav-item" style="justify-content:center;">退出</button>
          </div>
          <div class="hidden" id="patRow">
            <input type="password" id="pat" placeholder="PAT（repo 权限）" autocomplete="off">
            <div style="display:flex;gap:6px;margin-top:6px;">
              <button type="button" id="savePat" class="nav-item" style="flex:1;justify-content:center;">保存</button>
              <button type="button" id="clearPat" class="nav-item" style="flex:1;justify-content:center;">清除</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="toolbar">
        <div class="search-wrap">
          <input type="search" id="q" placeholder="搜索文件名、路径、hash…">
        </div>
        <select id="sort">
          <option value="date-desc">时间 ↓</option>
          <option value="date-asc">时间 ↑</option>
          <option value="name-asc">名称 A-Z</option>
          <option value="name-desc">名称 Z-A</option>
          <option value="type">类型</option>
        </select>
        <select id="source">
          <option value="cdn">jsDelivr CDN</option>
          <option value="raw">GitHub Raw</option>
          <option value="local">本地 images/</option>
        </select>
        <div class="view-toggle">
          <button type="button" id="viewGrid" class="active" title="网格">▦</button>
          <button type="button" id="viewList" title="列表">☰</button>
        </div>
        <div class="hidden" id="manageBar" style="display:flex;gap:6px;align-items:center;">
          <label style="font-size:.8rem;display:flex;align-items:center;gap:4px;cursor:pointer;">
            <input type="checkbox" id="selectAll"> 全选
          </label>
          <span id="selCount" style="font-size:.8rem;color:var(--muted);">0</span>
          <button type="button" id="batchDelete" class="danger" disabled>删除</button>
          <button type="button" id="batchRename" disabled>重命名</button>
          <button type="button" id="batchReplace" disabled>替换</button>
        </div>
      </header>

      <div class="content">
        <div class="status-bar">
          <div id="stats"></div>
          <div class="status" id="status"></div>
        </div>
        <div id="mediaContainer"></div>
      </div>
    </div>

    <aside class="detail-panel" id="detailPanel">
      <div class="detail-head">
        <h2>资产详情</h2>
        <button type="button" class="detail-close" id="detailClose">&times;</button>
      </div>
      <div class="detail-preview" id="detailPreview"></div>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-actions" id="detailActions"></div>
    </aside>
  </div>

  <div class="lightbox" id="lightbox">
    <button type="button" class="lightbox-close" id="lightboxClose">&times;</button>
    <button type="button" class="lightbox-nav prev" id="lightboxPrev">‹</button>
    <button type="button" class="lightbox-nav next" id="lightboxNext">›</button>
    <div class="lightbox-inner">
      <div class="lightbox-media" id="lightboxContent"></div>
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <input type="file" id="replaceInput" accept="*/*">

  <script>
    const REPO = { owner: 'PioneerSunOvO', repo: 'PictureBed4PicGo', branch: 'master' };
    const OAUTH = {
      clientId: '',
      redirectUri: 'https://pioneersunovo.github.io/PictureBed4PicGo/gallery.html',
      scope: 'repo'
    };
  </script>
  <script src="gallery-app.js"></script>
  <script>
    GalleryApp.init({ items: [], oldMap: {} });
  </script>
</body>
</html>
