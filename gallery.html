<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PictureBed — GitHub 图床</title>
  <meta name="description" content="PictureBed4PicGo — GitHub 图床画廊，自动同步、重复检测与相似分析。">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PictureBed — GitHub 图床">
  <meta property="og:description" content="GitHub 图床画廊 · 自动同步 · 重复与相似检测">
  <meta property="og:url" content="https://pioneersunovo.github.io/PictureBed4PicGo/gallery.html">
  <meta property="og:image" id="ogImage" content="https://pioneersunovo.github.io/PictureBed4PicGo/assets/og-image.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PictureBed — GitHub 图床">
  <meta name="twitter:image" id="twitterImage" content="https://pioneersunovo.github.io/PictureBed4PicGo/assets/og-image.png">
  <meta name="theme-color" content="#4f6ef7">
  <link rel="icon" type="image/png" id="siteFavicon" href="assets/favicon.png">
  <link rel="apple-touch-icon" id="appleTouchIcon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7f9;
      --bg-panel: #ffffff;
      --bg-sidebar: #f0f2f5;
      --bg-hover: #eef1f5;
      --bg-active: #e8edf5;
      --bg-thumb: #eceff3;
      --line: #e2e6ec;
      --line-strong: #d0d6df;
      --text: #111827;
      --muted: #6b7280;
      --accent: #4f6ef7;
      --accent-hover: #3d5ce6;
      --accent-dim: rgba(79, 110, 247, 0.12);
      --warn: #d97706;
      --warn-dim: rgba(217, 119, 6, 0.1);
      --danger: #dc2626;
      --danger-dim: rgba(220, 38, 38, 0.08);
      --success: #059669;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow: 0 4px 16px rgba(16, 24, 40, 0.08);
      --shadow-lg: 0 16px 48px rgba(16, 24, 40, 0.12);
      --radius: 10px;
      --radius-lg: 14px;
      --sidebar-w: 220px;
      --detail-w: 320px;
      --toolbar-h: 56px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: 1fr;
      height: 100vh;
    }
    .app.detail-open { grid-template-columns: var(--sidebar-w) 1fr var(--detail-w); }

    /* Sidebar — Immich-style nav */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .brand {
      padding: 16px 14px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      box-shadow: var(--shadow-sm);
    }
    .brand-text { min-width: 0; }
    .brand h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 3px 0 0;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .nav {
      flex: 1;
      padding: 10px 8px;
      overflow-y: auto;
    }
    .nav-section {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 10px 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background .15s;
    }
    .nav-item:hover { background: var(--bg-hover); }
    .nav-item.active {
      background: var(--bg-active);
      color: var(--accent);
    }
    .nav-item .icon {
      width: 18px;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.75;
    }
    .nav-item .count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      background: rgba(0,0,0,.04);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .nav-item.active .count { color: var(--accent); background: var(--accent-dim); }
    .sidebar-foot {
      padding: 10px 10px 12px;
      border-top: 1px solid var(--line);
      background: var(--bg-sidebar);
    }
    .auth-block { display: flex; flex-direction: column; gap: 0; }
    .account-panel {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .account-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px 8px;
    }
    .account-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--bg-panel);
      box-shadow: 0 0 0 1px var(--line);
      background: var(--bg-thumb);
    }
    .account-meta { min-width: 0; flex: 1; }
    .account-name {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .account-sub {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .account-logout {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .account-logout:hover {
      background: var(--danger-dim);
      color: var(--danger);
    }
    .account-logout svg { width: 16px; height: 16px; }
    .account-sync {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-top: 1px solid var(--line);
      background: var(--bg-hover);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .account-sync:hover { background: var(--bg-active); }
    .account-sync .ico { font-size: 0.9rem; opacity: 0.75; }
    .login-panel { display: flex; flex-direction: column; gap: 8px; }
    .foot-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .foot-btn:hover { background: var(--bg-hover); border-color: var(--line-strong); }
    .foot-btn .ico { font-size: 0.85rem; opacity: 0.7; }
    .foot-btn-muted { color: var(--muted); }
    .foot-btn-muted:hover { color: var(--text); }
    .btn-github {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      background: #24292f;
      color: #fff;
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-github:hover { background: #1b1f23; }
    .btn-github .gh-mark {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .auth-hint {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
      padding: 0 2px;
    }

    /* Main */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .toolbar {
      height: var(--toolbar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
    }
    .toolbar .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .toolbar .search-wrap::before {
      content: "⌕";
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .toolbar input[type=search] {
      width: 100%;
      padding: 8px 12px 8px 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      font-size: 0.86rem;
      outline: none;
    }
    .toolbar input[type=search]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .toolbar select, .toolbar button {
      font-family: var(--sans);
      font-size: 0.82rem;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar button:hover, .toolbar select:hover { background: var(--bg-hover); }
    .toolbar button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    .toolbar button.primary:hover { background: var(--accent-hover); }
    .toolbar button.danger {
      color: var(--danger);
      border-color: rgba(220,38,38,.25);
      background: var(--danger-dim);
    }
    .toolbar button:disabled { opacity: .4; cursor: not-allowed; }
    .view-toggle {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .view-toggle button {
      border: none;
      border-radius: 0;
      padding: 7px 10px;
      background: var(--bg-panel);
    }
    .view-toggle button + button { border-left: 1px solid var(--line); }
    .view-toggle button.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .status-bar strong { color: var(--text); }
    .status { min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--success); }

    /* Date groups — Immich timeline */
    .date-group { margin-bottom: 20px; }
    .date-group-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 10px 2px;
      letter-spacing: 0.02em;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      animation: rise .3s ease both;
    }
    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    .card.dup { border-color: rgba(217,119,6,.35); }
    .card-check {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      opacity: 0;
      transition: opacity .15s;
    }
    .card:hover .card-check, .card.selected .card-check { opacity: 1; }
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(217,119,6,.3);
      color: var(--warn);
    }
    .type-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 4;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(17,24,39,.65);
      color: #fff;
      letter-spacing: 0.04em;
    }
    .thumb-wrap {
      aspect-ratio: 1;
      background: var(--bg-thumb);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .thumb-wrap img, .thumb-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-icon {
      font-size: 2.2rem;
      opacity: 0.45;
      user-select: none;
    }
    .thumb-ext {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
    .card-hover {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(17,24,39,.55));
      opacity: 0;
      transition: opacity .2s;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      gap: 4px;
      z-index: 3;
    }
    .card:hover .card-hover { opacity: 1; }
    .card-hover button {
      font-size: 0.68rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,.92);
      color: var(--text);
      cursor: pointer;
    }
    .card-hover button:hover { background: #fff; }
    .card-hover button.del { color: var(--danger); }
    .card-meta {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--line);
    }
    .card-name {
      font-family: var(--mono);
      font-size: 0.68rem;
      line-height: 1.4;
      word-break: break-all;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-date {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* List view */
    .list { display: flex; flex-direction: column; gap: 4px; }
    .list-row {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .list-row:hover { background: var(--bg-hover); }
    .list-row.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .list-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: var(--bg-thumb);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .list-info .name {
      font-family: var(--mono);
      font-size: 0.78rem;
      word-break: break-all;
    }
    .list-info .sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .list-actions { display: flex; gap: 4px; }
    .list-actions button {
      font-size: 0.72rem;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-panel);
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
      background: var(--bg-panel);
    }

    /* Duplicate / similar groups */
    .dup-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 14px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .dup-toolbar .hint {
      flex: 1;
      min-width: 200px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .dup-toolbar button {
      font-size: 0.82rem;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      cursor: pointer;
    }
    .dup-toolbar button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .dup-toolbar label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dup-toolbar input[type=range] { width: 100px; accent-color: var(--accent); }

    .dup-group {
      margin-bottom: 22px;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .dup-group-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--line);
    }
    .dup-group-title {
      font-size: 0.86rem;
      font-weight: 600;
      flex: 1;
      min-width: 160px;
    }
    .dup-group-title .sub {
      font-weight: 400;
      color: var(--muted);
      font-size: 0.78rem;
      margin-left: 6px;
    }
    .dup-group-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .dup-group-actions button {
      font-size: 0.75rem;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--bg-panel);
      cursor: pointer;
    }
    .dup-group-actions button:hover { background: var(--bg-active); }
    .dup-group-grid {
      padding: 14px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .card.keep { border-color: rgba(5, 150, 105, 0.45); }
    .keep-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 5;
      font-size: 0.62rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(5, 150, 105, 0.92);
      color: #fff;
      letter-spacing: 0.03em;
    }
    .card.selected:not(.keep) { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-dim); }
    .scan-progress {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .scan-progress .bar {
      height: 6px;
      background: var(--line);
      border-radius: 999px;
      margin: 16px auto;
      max-width: 320px;
      overflow: hidden;
    }
    .scan-progress .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #7c9aff);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .similar-scan .scan-steps {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.78rem;
    }
    .similar-scan .scan-steps span {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-hover);
      color: var(--muted);
    }
    .similar-scan .scan-steps span.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }
    .similar-scan .scan-steps span.done {
      color: var(--success);
    }
    .similar-scan .scan-meta { font-size: 0.75rem; margin-top: 8px; }

    .dup-workflow { display: flex; flex-direction: column; gap: 12px; }
    .dup-toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .dup-select {
      font-size: 0.78rem;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
    }
    a.btn-link {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.78rem;
    }
    a.btn-link:hover { background: var(--accent-dim, rgba(79,110,247,.12)); }
    .thresh-label { font-size: 0.78rem; color: var(--muted); }
    .dup-warn {
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--warn-dim);
      border: 1px solid rgba(217, 119, 6, 0.25);
      color: var(--warn);
      font-size: 0.82rem;
    }
    .dup-group-head { cursor: pointer; user-select: none; }
    .dup-group.collapsed .dup-group-head { border-bottom: none; }
    .dup-collapse-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 6px;
    }
    .dup-collapse-btn:hover { background: var(--bg-active); color: var(--text); }
    .card.sim-candidate { border-color: rgba(220, 38, 38, 0.25); }
    .sim-score {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(79, 110, 247, 0.92);
      color: #fff;
    }
    .sim-bar {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 52px;
      height: 3px;
      background: rgba(0,0,0,.08);
      border-radius: 999px;
      overflow: hidden;
      z-index: 4;
    }
    .sim-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }
    .match-path {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 5;
      font-size: 0.58rem;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0,0,0,.55);
      color: #fff;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scan-summary {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }
    .suspect-section {
      margin-top: 20px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f3f4f6;
      overflow: hidden;
    }
    .suspect-section.collapsed .suspect-body { display: none; }
    .suspect-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
      color: #9ca3af;
    }
    .suspect-head:hover { background: #eceef1; }
    .suspect-title {
      font-size: 0.78rem;
      font-weight: 500;
      color: #9ca3af;
      margin: 0;
      flex: 1;
    }
    .suspect-title .sub {
      font-weight: 400;
      margin-left: 6px;
      opacity: 0.85;
    }
    .suspect-body {
      padding: 4px 10px 12px;
      border-top: 1px solid #e5e7eb;
    }
    .dup-group.suspect {
      border-color: #e5e7eb;
      background: #fafafa;
      box-shadow: none;
    }
    .dup-group.suspect .dup-group-title { color: #9ca3af; }
    .dup-group.suspect .sub { color: #c0c4ca; }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(17, 24, 39, 0.58);
      backdrop-filter: blur(6px);
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      padding: 16px 16px 12px;
      gap: 12px;
    }
    .lightbox.open { display: flex; }
    .lightbox-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-view {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }
    .lightbox-view.compare { align-items: stretch; }
    .lb-pane {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }
    .lb-pane-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,.78);
      background: rgba(17,24,39,.35);
      padding: 3px 10px;
      border-radius: 999px;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-zoom {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 120px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: grab;
      touch-action: none;
    }
    .lb-zoom.dragging { cursor: grabbing; }
    .lb-zoom img,
    .lb-zoom video {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 160px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lightbox-view:not(.compare) .lb-zoom img,
    .lightbox-view:not(.compare) .lb-zoom video {
      max-height: calc(100vh - 140px);
    }
    .lightbox-view.compare .lb-zoom img,
    .lightbox-view.compare .lb-zoom video {
      max-height: calc(100vh - 200px);
    }
    .lb-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 100%;
    }
    .lb-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      padding: 0;
      cursor: pointer;
      background: rgba(255,255,255,.12);
    }
    .lb-thumb.active { border-color: #93a8ff; }
    .lb-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lightbox-media-fallback {
      max-width: min(92vw, 900px);
      max-height: calc(100vh - 140px);
      color: #e2e8f0;
    }
    .lightbox-text {
      width: min(92vw, 800px);
      max-height: calc(100vh - 140px);
      overflow: auto;
      background: #1e293b;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
      transition: background .15s ease, transform .15s ease;
    }
    .lightbox-nav:hover {
      background: rgba(255,255,255,.28);
      transform: translateY(-50%) scale(1.04);
    }
    .lightbox-nav.prev { left: 8px; }
    .lightbox-nav.next { right: 8px; }
    .lightbox.compare-mode .lightbox-nav { display: none; }
    .lightbox-toolbar {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 6px;
    }
    .lightbox-caption {
      color: rgba(255,255,255,.88);
      font-size: 0.82rem;
      text-align: center;
      max-width: min(92vw, 720px);
      word-break: break-all;
      line-height: 1.4;
    }
    .lightbox-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .lightbox-actions button {
      font-size: 0.8rem;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.14);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .15s ease;
    }
    .lightbox-actions button:hover { background: rgba(255,255,255,.26); }
    .lightbox-actions button.danger {
      border-color: rgba(248,113,113,.45);
      background: rgba(220,38,38,.28);
    }
    .lightbox-actions button.danger:hover { background: rgba(220,38,38,.42); }
    .lightbox-actions button.primary {
      background: rgba(79,110,247,.85);
      border-color: transparent;
    }
    .lightbox-actions button.primary:hover { background: rgba(79,110,247,1); }

    .lightbox.fullscreen-mode {
      padding: 0;
      gap: 0;
      background: #0b0f17;
      backdrop-filter: none;
    }
    .lightbox.fullscreen-mode .lightbox-stage {
      flex: 1 1 auto;
      height: 100vh;
      max-height: 100vh;
    }
    .lightbox.fullscreen-mode .lightbox-view {
      max-height: 100vh;
      height: 100%;
    }
    .lightbox.fullscreen-mode .lb-zoom {
      border-radius: 0;
      min-height: 100%;
      height: 100%;
    }
    .lightbox.fullscreen-mode .lb-zoom img,
    .lightbox.fullscreen-mode .lb-zoom video {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      border-radius: 0;
      box-shadow: none;
      object-fit: contain;
    }
    .lightbox.fullscreen-mode .lightbox-nav { display: none; }
    .lightbox-exit {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 210;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(17,24,39,.55);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .15s ease, transform .15s ease;
    }
    .lightbox-exit:hover {
      background: rgba(255,255,255,.22);
      transform: scale(1.04);
    }
    .lightbox.fullscreen-mode .lightbox-exit { display: flex; align-items: center; justify-content: center; }
    .lightbox-exit[hidden] { display: none !important; }

    .sidebar-foot .account-panel {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }
    .sidebar-foot .account-head { padding: 8px 4px; }
    .sidebar-foot .account-sync {
      border-radius: 8px;
      border: 1px solid var(--line);
      margin-top: 6px;
      background: var(--bg-panel);
    }

    /* Detail panel — ImageKit DAM metadata */
    .detail-panel {
      display: none;
      flex-direction: column;
      background: var(--bg-panel);
      border-left: 1px solid var(--line);
      overflow: hidden;
    }
    .app.detail-open .detail-panel { display: flex; }
    .detail-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-head h2 {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .detail-close {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .detail-close:hover { background: var(--bg-hover); color: var(--text); }
    .detail-preview {
      aspect-ratio: 1;
      background: var(--bg-thumb);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }
    .detail-preview img, .detail-preview video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }
    .detail-section {
      margin-bottom: 18px;
      padding-bottom: 4px;
    }
    .detail-section + .detail-section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }
    .detail-section h3 {
      margin: 0 0 10px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
    }
    .meta-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
    }
    .meta-desc {
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .meta-value {
      font-family: var(--mono);
      font-size: 0.72rem;
      word-break: break-all;
      line-height: 1.45;
      color: var(--text);
      margin-top: 2px;
    }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .detail-actions button, .detail-actions a {
      font-size: 0.78rem;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-panel);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .detail-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .detail-actions button.danger {
      color: var(--danger);
      border-color: rgba(220,38,38,.25);
      background: var(--danger-dim);
    }

    .hidden { display: none !important; }
    #replaceInput { display: none; }
    #patRow { padding: 0 2px; }
    #patRow input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .pat-toggle {
      font-size: 0.75rem;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 6px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .pat-toggle:hover { color: var(--text); }

    .private-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.22);
      vertical-align: middle;
    }
    .card .private-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
    }
    .login-gate-panel {
      max-width: 520px;
      margin: 10vh auto 0;
      padding: 36px 32px;
      text-align: center;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    .login-gate-panel h2 { margin: 0 0 12px; font-size: 1.35rem; }
    .login-gate-panel p { margin: 0 0 12px; color: var(--muted); line-height: 1.6; }
    .login-gate-panel code {
      font-family: var(--mono);
      font-size: 0.85em;
      background: var(--bg-hover);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .login-gate-icon { font-size: 2.4rem; margin-bottom: 8px; }
    .login-gate-hint { font-size: 0.9rem; }
    .app.gated .main { pointer-events: none; opacity: 0.45; filter: blur(1px); }
    .app.gated .sidebar { opacity: 1; filter: none; pointer-events: auto; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 900px) {
      .app, .app.detail-open { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .detail-panel { display: none !important; }
    }
    @media (max-width: 640px) {
      .toolbar { flex-wrap: wrap; height: auto; padding: 10px; }
      .toolbar .search-wrap { max-width: 100%; flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="app" id="appShell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-avatar" id="brandAvatar" src="assets/apple-touch-icon.png" alt="PictureBed">
        <div class="brand-text">
          <h1>PictureBed</h1>
          <p>GitHub 图床 · 自动同步</p>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-section">媒体库</div>
        <button type="button" class="nav-item active" data-cat="all"><span class="icon">▦</span>全部 <span class="count" id="cntAll">0</span></button>
        <button type="button" class="nav-item" data-cat="image"><span class="icon">🖼</span>图片 <span class="count" id="cntImage">0</span></button>
        <button type="button" class="nav-item" data-cat="video"><span class="icon">▶</span>视频 <span class="count" id="cntVideo">0</span></button>
        <button type="button" class="nav-item" data-cat="audio"><span class="icon">♫</span>音频 <span class="count" id="cntAudio">0</span></button>
        <button type="button" class="nav-item" data-cat="document"><span class="icon">📄</span>文档 <span class="count" id="cntDocument">0</span></button>
        <button type="button" class="nav-item" data-cat="text"><span class="icon">⌨</span>文本 <span class="count" id="cntText">0</span></button>
        <button type="button" class="nav-item" data-cat="other"><span class="icon">📦</span>其他 <span class="count" id="cntOther">0</span></button>
        <button type="button" class="nav-item" data-cat="vault"><span class="icon">🔒</span>私有 <span class="count" id="cntVault">0</span></button>
        <div class="nav-section">工具</div>
        <button type="button" class="nav-item" data-cat="dup"><span class="icon">⚠</span>重复 <span class="count" id="dupCount">0</span></button>
        <button type="button" class="nav-item" data-cat="similar"><span class="icon">◎</span>相似 <span class="count" id="similarCount">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="auth-block" id="authPanel">
          <div id="loginRow" class="login-panel">
            <button type="button" id="githubLogin" class="btn-github">
              <svg class="gh-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
              GitHub 登录
            </button>
            <button type="button" id="refreshList" class="account-sync" style="border:1px solid var(--line);border-radius:10px;">
              <span class="ico">↻</span> 同步图库
            </button>
            <p class="auth-hint" id="patStatus">登录后查看图库列表与私有文件</p>
            <button type="button" id="patToggle" class="pat-toggle">手动 PAT ▾</button>
          </div>
          <div class="hidden account-panel" id="loggedRow">
            <div class="account-head">
              <img class="account-avatar" id="authAvatar" src="assets/apple-touch-icon.png" alt="">
              <div class="account-meta">
                <span class="account-name" id="authUser">@user</span>
                <span class="account-sub">GitHub 已连接</span>
              </div>
              <button type="button" id="githubLogout" class="account-logout" title="退出登录" aria-label="退出登录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              </button>
            </div>
            <button type="button" id="refreshListLogged" class="account-sync">
              <span class="ico">↻</span> 同步图库
            </button>
          </div>
          <div class="hidden" id="patRow">
            <input type="password" id="pat" placeholder="PAT（repo 权限）" autocomplete="off">
            <div class="foot-actions" style="margin-top:6px;">
              <button type="button" id="savePat" class="foot-btn">保存</button>
              <button type="button" id="clearPat" class="foot-btn foot-btn-muted">清除</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="toolbar">
        <div class="search-wrap">
          <input type="search" id="q" placeholder="搜索文件名、路径、hash…">
        </div>
        <select id="sort">
          <option value="date-desc">时间 ↓</option>
          <option value="date-asc">时间 ↑</option>
          <option value="name-asc">名称 A-Z</option>
          <option value="name-desc">名称 Z-A</option>
          <option value="type">类型</option>
        </select>
        <select id="source">
          <option value="cdn">jsDelivr CDN</option>
          <option value="raw">GitHub Raw</option>
          <option value="local">本地 images/</option>
        </select>
        <div class="view-toggle">
          <button type="button" id="viewGrid" class="active" title="网格">▦</button>
          <button type="button" id="viewList" title="列表">☰</button>
