name: similar-index

on:
  push:
    paths:
      - "images/**"
      - "scripts/build_similar_index.py"
      - "scripts/requirements-similar.txt"
      - ".github/workflows/similar-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: similar-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-similar.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-clip-vit-b32-${{ hashFiles('scripts/requirements-similar.txt') }}
          restore-keys: |
            hf-clip-vit-b32-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-similar.txt

      - name: Regression tests (near / no CLIP)
        working-directory: scripts
        run: pytest test_similar_index.py -v

      - name: Build similar index (with CLIP)
        run: python scripts/build_similar_index.py --images images --out meta/similar-index.json

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/similar-index.json
          if git diff --staged --quiet; then
            echo "No index changes"
          else
            git commit -m "chore: update meta/similar-index.json"
            git push
          fi
